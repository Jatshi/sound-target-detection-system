apiVersion: apps/v1
kind: Deployment
metadata:
  name: sounddet-inference
  labels:
    app: sounddet-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sounddet-inference
  template:
    metadata:
      labels:
        app: sounddet-inference
    spec:
      containers:
        - name: sounddet-api
          image: sounddet-edge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: http
          env:
            - name: SOUNDDET_INFERENCE_BACKEND
              value: "onnxruntime-cuda"
            - name: SOUNDDET_DEFAULT_MODEL
              value: "neurocap_resnet10"
          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: "8Gi"
            requests:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sounddet-inference
spec:
  selector:
    app: sounddet-inference
  ports:
    - name: http
      port: 8765
      targetPort: 8765
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sounddet-inference-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sounddet-inference
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Pods
      pods:
        metric:
          name: inference_queue_depth
        target:
          type: AverageValue
          averageValue: "32"
